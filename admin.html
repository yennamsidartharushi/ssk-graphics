 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | SSK Graphics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-dark: #0A0A0A;
            --surface-dark: #121212;
            --surface-light: #1E1E1E;
            --text-main: #FFFFFF;
            --text-muted: #888888;
            --accent-gold: #D4AF37;
            --border-color: #333333;
            --danger: #C62828;
            --success: #2E7D32;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        /* Login Screen */
        #admin-login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); display: flex; align-items: center; justify-content: center; z-index: 5000; transition: opacity 0.5s ease; }
        .admin-login-box { background: var(--surface-dark); padding: 40px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .admin-login-box h2 { font-family: 'Playfair Display', serif; color: var(--accent-gold); margin-bottom: 20px; font-size: 2rem;}
        .admin-input { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg-dark); border: 1px solid var(--border-color); color: white; border-radius: 6px; outline: none; }
        .admin-input:focus { border-color: var(--accent-gold); }
        .admin-btn { width: 100%; padding: 12px; background: var(--accent-gold); color: #000; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .admin-btn:hover { background: #FFF; }
        
        .admin-divider { display: flex; align-items: center; text-align: center; color: var(--text-muted); font-size: 0.85rem; margin: 20px 0; }
        .admin-divider::before, .admin-divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .admin-divider::before { margin-right: 1em; }
        .admin-divider::after { margin-left: 1em; }

        /* Main Dashboard */
        #admin-dashboard { display: none; width: 100%; height: 100%; }
        
        .sidebar { width: 260px; background: var(--surface-dark); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar-header { padding: 0 20px 20px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .sidebar-header h2 { font-family: 'Playfair Display', serif; color: var(--accent-gold); font-size: 1.2rem; }
        .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 5px; padding: 0 10px; flex: 1; }
        .sidebar-menu li { padding: 12px 20px; border-radius: 8px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; gap: 12px; transition: 0.3s; font-weight: 500; }
        .sidebar-menu li:hover, .sidebar-menu li.active { background: var(--surface-light); color: var(--accent-gold); }
        .sidebar-menu i { font-size: 1.4rem; }
        .sidebar-footer { padding: 20px; border-top: 1px solid var(--border-color); }
        .btn-logout { background: transparent; color: var(--danger); border: 1px solid var(--danger); width: 100%; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s;}
        .btn-logout:hover { background: var(--danger); color: white; }

        .main-content { flex: 1; background: var(--bg-dark); display: flex; flex-direction: column; overflow-y: auto; }
        .topbar { height: 70px; background: var(--surface-dark); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; flex-shrink: 0;}
        .admin-profile { display: flex; align-items: center; gap: 10px; font-weight: 500; }
        .admin-profile i { font-size: 1.5rem; color: var(--accent-gold); }
        
        .dashboard-content { padding: 40px 30px; }
        .page-title { font-size: 1.8rem; margin-bottom: 30px; font-family: 'Playfair Display', serif; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--surface-light); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 20px; }
        .stat-icon { width: 60px; height: 60px; border-radius: 12px; background: rgba(212, 175, 55, 0.1); color: var(--accent-gold); display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .stat-info h3 { color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 5px; }
        .stat-info p { font-size: 1.8rem; font-weight: 600; color: var(--text-main); }

        .data-panel { background: var(--surface-dark); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; }
        .panel-header { padding: 20px 25px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .btn-add { background: var(--accent-gold); color: #000; border: none; padding: 8px 15px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px 25px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-weight: 500; font-size: 0.85rem; text-transform: uppercase; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .status-active { background: rgba(46, 125, 50, 0.2); color: var(--success); }
        .status-out { background: rgba(198, 40, 40, 0.2); color: var(--danger); }
        .action-btns i { cursor: pointer; font-size: 1.2rem; margin-right: 10px; color: var(--text-muted); transition: 0.3s; }
        .action-btns i:hover { color: var(--danger); }

        /* Add Product Modal */
        #add-product-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 6000; }
        .add-box { background: var(--surface-dark); padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; border: 1px solid var(--border-color); }
        .add-box h3 { margin-bottom: 20px; color: var(--accent-gold); }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .add-box label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
        .add-box select { width: 100%; padding: 10px; margin-bottom: 15px; background: var(--bg-dark); border: 1px solid var(--border-color); color: white; border-radius: 6px; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-cancel { flex: 1; padding: 10px; background: transparent; border: 1px solid var(--border-color); color: white; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="admin-login-screen">
        <div class="admin-login-box">
            <h2>Admin Portal</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">Authorized personnel only.</p>
            
            <input type="email" id="admin-email" class="admin-input" placeholder="Admin Email">
            <input type="password" id="admin-password" class="admin-input" placeholder="Password">
            <button class="admin-btn" onclick="loginAdmin()">Secure Login</button>

            <div class="admin-divider">OR</div>
            
            <button class="admin-btn" style="background: white; color: black;" onclick="loginAdminWithGoogle()">
                <i class="ph-fill ph-google-logo" style="font-size: 1.3rem;"></i> Sign in with Google
            </button>

        </div>
    </div>

    <div id="admin-dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>SSK Graphics</h2>
            </div>
            <ul class="sidebar-menu">
                <li class="active"><i class="ph-fill ph-squares-four"></i> Dashboard</li>
                <li><i class="ph-fill ph-shopping-bag"></i> Products DB</li>
                <li><i class="ph-fill ph-receipt"></i> Order Logs</li>
            </ul>
            <div class="sidebar-footer">
                <button class="btn-logout" onclick="logoutAdmin()"><i class="ph-bold ph-sign-out"></i> Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div style="color: var(--text-muted);">Admin Workspace v1.0</div>
                <div class="admin-profile">
                    <span id="admin-user-display">Admin</span>
                    <i class="ph-fill ph-user-circle"></i>
                </div>
            </header>

            <div class="dashboard-content">
                <h1 class="page-title">Dashboard Overview</h1>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon"><i class="ph-fill ph-shopping-cart"></i></div>
                        <div class="stat-info">
                            <h3>Total Orders</h3>
                            <p id="stat-orders">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="ph-fill ph-package"></i></div>
                        <div class="stat-info">
                            <h3>Live Products</h3>
                            <p id="stat-products">0</p>
                        </div>
                    </div>
                </div>

                <div class="data-panel">
                    <div class="panel-header">
                        <h3 style="font-weight: 500;">Product Database</h3>
                        <button class="btn-add" onclick="showAddModal()"><i class="ph-bold ph-plus"></i> Add Product</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Delete</th>
                            </tr>
                        </thead>
                        <tbody id="admin-product-table">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="add-product-modal">
        <div class="add-box">
            <h3>Add New Product</h3>
            <label>Product Name</label>
            <input type="text" id="new-name" class="admin-input" placeholder="e.g. Custom Magic Mug">
            
            <div class="form-row">
                <div style="flex: 1;">
                    <label>Category</label>
                    <select id="new-category">
                        <option value="printing">Printing</option>
                        <option value="frames">Frames</option>
                        <option value="gifts">Gifts</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label>Price (₹)</label>
                    <input type="number" id="new-price" class="admin-input" placeholder="299">
                </div>
            </div>

            <div class="form-row">
                <div style="flex: 1;">
                    <label>Size / Type</label>
                    <input type="text" id="new-size" class="admin-input" placeholder="e.g. 11oz">
                </div>
                <div style="flex: 1;">
                    <label>In Stock?</label>
                    <select id="new-stock">
                        <option value="true">Yes, Available</option>
                        <option value="false">Out of Stock</option>
                    </select>
                </div>
            </div>

            <label>Image URL (Pexels, Unsplash, etc.)</label>
            <input type="text" id="new-img" class="admin-input" placeholder="https://...">

            <label>Description</label>
            <input type="text" id="new-desc" class="admin-input" placeholder="Short description...">

            <div class="btn-group">
                <button class="btn-cancel" onclick="hideAddModal()">Cancel</button>
                <button class="admin-btn" style="flex: 1; margin: 0;" onclick="saveNewProduct()">Save Product</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBPx-vq-U49-eVShAmqtl76gZxkNrzab5c",
            authDomain: "studio-8663990014-66c3b.firebaseapp.com",
            databaseURL: "https://studio-8663990014-66c3b-default-rtdb.firebaseio.com",
            projectId: "studio-8663990014-66c3b",
            storageBucket: "studio-8663990014-66c3b.firebasestorage.app",
            messagingSenderId: "1058628689901",
            appId: "1:1058628689901:web:232aba87b6c85d56ef91e4"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // =============== IMPORTANT =================
        // Change this to the exact Google Email Address you will use to log in!
        const ADMIN_EMAIL = "admin@sskgraphics.com"; 
        // ===========================================

        auth.onAuthStateChanged(user => {
            const loginScreen = document.getElementById('admin-login-screen');
            const dashboard = document.getElementById('admin-dashboard');

            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('admin-user-display').innerText = user.displayName || user.email;
                loginScreen.style.opacity = '0';
                setTimeout(() => {
                    loginScreen.style.display = 'none';
                    dashboard.style.display = 'flex';
                    fetchDashboardData();
                }, 500);
            } else if (user) {
                // If a normal customer logs in via Google on this page, kick them out
                alert("Access Denied. You do not have administrator privileges.");
                auth.signOut();
            } else {
                dashboard.style.display = 'none';
                loginScreen.style.display = 'flex';
                loginScreen.style.opacity = '1';
            }
        });

        // Traditional Email/Password Login
        function loginAdmin() {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            if(!email || !password) return alert("Please enter credentials.");
            auth.signInWithEmailAndPassword(email, password).catch(err => alert(err.message));
        }

        // NEW: Google Login
        function loginAdminWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => {
                alert("Google Sign-In Failed: " + err.message);
            });
        }

        function logoutAdmin() { auth.signOut(); }

        // Fetch Live Data from Firestore
        async function fetchDashboardData() {
            try {
                const ordersSnap = await db.collection('orders').get();
                document.getElementById('stat-orders').innerText = ordersSnap.size;

                const productsSnap = await db.collection('products').get();
                document.getElementById('stat-products').innerText = productsSnap.size;
                
                const tableBody = document.getElementById('admin-product-table');
                tableBody.innerHTML = '';
                
                productsSnap.forEach(doc => {
                    const data = doc.data();
                    const statusHtml = data.inStock 
                        ? `<span class="status-badge status-active">In Stock</span>` 
                        : `<span class="status-badge status-out">Out</span>`;
                    
                    tableBody.innerHTML += `
                        <tr>
                            <td style="font-weight: 500;">${data.name}</td>
                            <td style="text-transform: capitalize;">${data.category}</td>
                            <td>₹${data.price}</td>
                            <td>${statusHtml}</td>
                            <td class="action-btns">
                                <i class="ph-fill ph-trash" onclick="deleteProduct('${doc.id}')"></i>
                            </td>
                        </tr>
                    `;
                });
            } catch(e) { console.error(e); }
        }

        // Add New Product
        function showAddModal() { document.getElementById('add-product-modal').style.display = 'flex'; }
        function hideAddModal() { document.getElementById('add-product-modal').style.display = 'none'; }

        async function saveNewProduct() {
            const newProduct = {
                name: document.getElementById('new-name').value,
                category: document.getElementById('new-category').value,
                price: Number(document.getElementById('new-price').value),
                size: document.getElementById('new-size').value,
                inStock: document.getElementById('new-stock').value === 'true',
                image: document.getElementById('new-img').value || "https://images.pexels.com/photos/10186985/pexels-photo-10186985.jpeg?auto=compress&cs=tinysrgb&w=800",
                lifestyleImage: document.getElementById('new-img').value || "https://images.pexels.com/photos/10186985/pexels-photo-10186985.jpeg?auto=compress&cs=tinysrgb&w=800",
                description: document.getElementById('new-desc').value
            };

            if(!newProduct.name || !newProduct.price) return alert("Name and Price are required.");

            try {
                await db.collection('products').add(newProduct);
                alert("Product Added Successfully!");
                hideAddModal();
                fetchDashboardData(); 
            } catch(e) { alert("Error adding product: " + e.message); }
        }

        async function deleteProduct(id) {
            if(confirm("Are you sure you want to permanently delete this product?")) {
                await db.collection('products').doc(id).delete();
                fetchDashboardData(); 
            }
        }
    </script>
</body>
</html>
